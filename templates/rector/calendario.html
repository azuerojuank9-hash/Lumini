{% extends "base.html" %}
{% block title %}LUMINI — Calendario{% endblock %}
{% block sidebar %}
{% include "rector_panel.html" %}
{% endblock %}
{% block content %}
<div class="topbar">
  <h1><i data-lucide="calendar" style="color:var(--accent);"></i> Calendario</h1>
  <div class="breadcrumb">Gestión de eventos académicos</div>
</div>
<div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:40px;text-align:center;color:var(--muted);">
  <i data-lucide="construction" style="width:48px;height:48px;margin-bottom:12px;opacity:.4;"></i>
  <p>Módulo de calendario en construcción.</p>
  <a href="/{{ slug }}/rector" class="btn btn-primary" style="margin-top:16px;"><i data-lucide="arrow-left"></i> Volver al panel</a>
</div>
{% endblock %}
