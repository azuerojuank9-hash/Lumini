<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumini — Error {{ codigo }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Sans', sans-serif; background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #e8e8f0; text-align: center; padding: 20px; }
        .num { font-family: 'Syne', sans-serif; font-size: 6rem; font-weight: 800; background: linear-gradient(135deg, #fff 30%, #6c63ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1; }
        .msg { color: #7a7a90; margin-top: 12px; font-size: 15px; }
        .brand { font-family: 'Syne', sans-serif; font-size: 1.1rem; letter-spacing: 5px; margin-bottom: 32px; background: linear-gradient(135deg, #fff 30%, #6c63ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    </style>
</head>
<body>
<div>
    <div class="brand">LUMINI</div>
    <div class="num">{{ codigo }}</div>
    <div class="msg">{{ mensaje }}</div>
</div>
</body>
</html>
