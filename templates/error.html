<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumini — Error {{ codigo }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#080B14;--accent:#2563EB;--accent2:#7C3AED;--accent-rgb:37,99,235;--text:#F8FAFC;--muted:#94A3B8;}
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'DM Sans',sans-serif;background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--text);text-align:center;padding:20px;position:relative;overflow-x:hidden;}
        body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,rgba(37,99,235,.06) 1px,transparent 1px);background-size:32px 32px;pointer-events:none;}
        .bg-orb{position:fixed;border-radius:50%;filter:blur(120px);opacity:.15;animation:float 10s ease-in-out infinite;pointer-events:none;}
        .orb1{width:400px;height:400px;background:var(--accent);top:-100px;right:-100px;animation-delay:0s;}
        .orb2{width:300px;height:300px;background:var(--accent2);bottom:-80px;left:-80px;animation-delay:5s;}
        @keyframes float{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-20px) scale(1.03);}}
        .wrap{position:relative;z-index:1;animation:slideUp .5s cubic-bezier(.16,1,.3,1) both;}
        @keyframes slideUp{from{opacity:0;transform:translateY(28px);}to{opacity:1;transform:translateY(0);}}
        .num{font-family:'Syne',sans-serif;font-size:6rem;font-weight:800;background:linear-gradient(135deg,#fff 30%,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;text-shadow:0 0 80px rgba(37,99,235,.15);}
        .msg{color:var(--muted);margin-top:12px;font-size:15px;line-height:1.6;max-width:400px;}
        .brand{font-family:'Syne',sans-serif;font-size:1.1rem;letter-spacing:5px;margin-bottom:32px;background:linear-gradient(135deg,#fff 30%,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
        .back{display:inline-block;margin-top:24px;padding:12px 28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;text-decoration:none;font-size:13px;font-weight:600;transition:all .2s;box-shadow:0 4px 15px rgba(37,99,235,.3);}
        .back:hover{transform:translateY(-2px);box-shadow:0 6px 25px rgba(37,99,235,.4);}
    </style>
</head>
<body>
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>
<div class="wrap">
    <a href="/" style="text-decoration:none;color:inherit;display:inline-block;"><div class="brand">LUMINI</div></a>
    <div class="num">{{ codigo }}</div>
    <div class="msg">{{ mensaje }}</div>
    <a href="/" class="back">← Volver al inicio</a>
</div>
</body>
</html>
