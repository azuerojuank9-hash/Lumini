<!-- ═══════════════════════════════════════════════════════════════════════
     BOTÓN "ENVIAR A DIRECTORA"
     Pégalo en tu index.html donde aparece el encabezado del curso/periodo,
     cerca del selector de periodo o de los botones de acciones del profesor.
════════════════════════════════════════════════════════════════════════ -->

{% if curso_sel %}
<div style="display:flex;align-items:center;gap:10px;margin:10px 0 16px;flex-wrap:wrap;">

  {% if ya_envio %}
  <!-- Ya envió — mostrar estado verde -->
  <span style="padding:7px 16px;border-radius:8px;background:#1a3a2a;color:#2ecc71;font-size:13px;font-weight:600;border:1px solid #2ecc7133;">
    ✅ Notas enviadas a la directora
  </span>
  <button onclick="reenviarDirectora()"
          style="padding:6px 12px;border-radius:8px;background:#ffffff08;color:#aaa;
                 font-size:12px;border:1px solid #ffffff15;cursor:pointer;">
    🔄 Reenviar
  </button>
  {% else %}
  <!-- Todavía no ha enviado -->
  <button id="btn-enviar-dir" onclick="enviarADirectora()"
          style="padding:8px 18px;border-radius:8px;
                 background:linear-gradient(135deg,#27ae60,#2ecc71);
                 color:white;border:none;cursor:pointer;font-size:13px;font-weight:600;
                 box-shadow:0 2px 8px #27ae6040;">
    📨 Enviar notas a la directora
  </button>
  {% endif %}

  <span id="estado-envio-dir" style="font-size:12px;color:#2ecc71;display:none;"></span>
</div>
{% endif %}

<script>
function enviarADirectora() {
  const btn = document.getElementById('btn-enviar-dir');
  if (!btn) return;
  btn.disabled = true;
  btn.textContent = '⏳ Enviando...';

  fetch('/{{ slug }}/enviar_a_directora', {
    method: 'POST',
    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: 'curso={{ curso_sel }}&periodo={{ periodo_sel }}'
  })
  .then(r => r.json())
  .then(d => {
    if (d.ok) {
      btn.style.display = 'none';
      const est = document.getElementById('estado-envio-dir');
      est.textContent = '✅ Notas enviadas correctamente a la directora';
      est.style.display = 'inline';
    } else {
      btn.disabled = false;
      btn.textContent = '📨 Enviar notas a la directora';
    }
  })
  .catch(() => {
    btn.disabled = false;
    btn.textContent = '📨 Enviar notas a la directora';
  });
}

function reenviarDirectora() {
  if (!confirm('¿Reenviar las notas actuales a la directora?')) return;
  fetch('/{{ slug }}/enviar_a_directora', {
    method: 'POST',
    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: 'curso={{ curso_sel }}&periodo={{ periodo_sel }}'
  })
  .then(r => r.json())
  .then(d => {
    if (d.ok) alert('✅ Notas reenviadas a la directora.');
  });
}
</script>
