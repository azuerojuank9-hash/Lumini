<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva contraseña — Lumini</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#08080f;--bg2:#11111e;--bg3:#191928;--border:rgba(255,255,255,.06);--accent:{{ colegio.primary_color if colegio and colegio.primary_color else '#6c63ff' }};--accent2:{{ colegio.secondary_color if colegio and colegio.secondary_color else '#3498db' }};--accent-rgb:{{ (colegio.primary_color if colegio and colegio.primary_color else '#6c63ff') | hex_to_rgb }};--text:#f0f0f8;--muted:#8080a0;--sub:#55557a;--rsm:8px;--rmd:12px;--rlg:16px;--tr:.2s cubic-bezier(.4,0,.2,1);}
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:'DM Sans',sans-serif;background:var(--bg);min-height:100vh;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;position:relative;overflow-x:hidden;}
        body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,rgba(var(--accent-rgb),.08) 1px,transparent 1px);background-size:32px 32px;pointer-events:none;}
        .bg-orb{position:fixed;border-radius:50%;filter:blur(100px);opacity:.12;animation:float 10s ease-in-out infinite;pointer-events:none;}
        .orb1{width:450px;height:450px;background:var(--accent);top:-120px;left:-120px;animation-delay:0s;}
        .orb2{width:300px;height:300px;background:var(--accent2);bottom:-80px;right:-80px;animation-delay:4s;}
        @keyframes float{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-25px) scale(1.03);}}
        .logo-wrap{margin-bottom:12px;text-align:center;}
        .logo-wrap img{height:60px;width:60px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px rgba(var(--accent-rgb),.4);}
        .brand{font-family:'Syne',sans-serif;font-size:1.6rem;font-weight:800;letter-spacing:6px;background:linear-gradient(135deg,#fff 30%,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-align:center;}
        .colegio-nombre{font-size:11px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-top:4px;margin-bottom:24px;text-align:center;}
        .card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rlg);padding:32px 28px;width:100%;max-width:440px;box-shadow:0 1px 4px rgba(0,0,0,.2);animation:slideUp .4s cubic-bezier(.16,1,.3,1) both;}
        @keyframes slideUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
        .card-icon{font-size:2.2rem;text-align:center;margin-bottom:10px;}
        .card-title{font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:700;text-align:center;color:var(--text);margin-bottom:6px;}
        .card-desc{font-size:13px;color:var(--muted);text-align:center;margin-bottom:24px;line-height:1.5;}
        .field{margin-bottom:16px;}
        .field label{display:block;font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:7px;font-weight:600;}
        .field input{width:100%;padding:11px 14px;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--rsm);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;transition:border-color var(--tr),box-shadow var(--tr);}
        .field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.12);}
        .field input::placeholder{color:var(--sub);}
        .btn-submit{width:100%;padding:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:var(--rsm);font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;transition:all var(--tr);box-shadow:0 4px 16px rgba(var(--accent-rgb),.2);}
        .btn-submit:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(var(--accent-rgb),.3);}
        .btn-submit:active{transform:scale(.98);}
        .alert{padding:10px 14px;border-radius:var(--rsm);font-size:13px;margin-bottom:16px;}
        .alert-error{background:rgba(231,76,60,.1);border:1px solid rgba(231,76,60,.2);color:#e74c3c;}
        .alert-success{background:rgba(46,204,113,.1);border:1px solid rgba(46,204,113,.2);color:#2ecc71;}
        .back-link{display:block;text-align:center;margin-top:18px;font-size:13px;color:var(--muted);text-decoration:none;transition:color var(--tr);}
        .back-link:hover{color:var(--accent);}
        @media(max-width:480px){.card{padding:24px 16px;}}
    </style>
</head>
<body>
<div class="logo-wrap"><img src="/static/logo.png" alt="Lumini"></div>
<div class="brand">LUMINI</div>
<p class="colegio-nombre">{{ colegio.nombre if colegio else slug }}</p>

<div class="card">
    <div class="card-icon">🔑</div>
    <div class="card-title">Nueva contraseña</div>
    <p class="card-desc">Crea una contraseña segura de al menos 6 caracteres.</p>

    {% if error %}
    <div class="alert alert-error">⚠️ {{ error }}</div>
    {% endif %}
    {% if exito %}
    <div class="alert alert-success">{{ exito }}</div>
    {% endif %}

    {% if exito %}
        <a href="/{{ slug }}/login" class="btn-submit" style="display:block;text-align:center;text-decoration:none;margin-top:8px;">
            Ir al inicio de sesión →
        </a>
    {% else %}
    <form method="POST" action="/{{ slug }}/reset/{{ token }}">
        <div class="field">
            <label>Nueva contraseña</label>
            <input type="password" name="nueva" placeholder="Mínimo 6 caracteres" required autocomplete="new-password" minlength="6">
        </div>
        <div class="field">
            <label>Confirmar contraseña</label>
            <input type="password" name="confirmar" placeholder="Repite la contraseña" required autocomplete="new-password" minlength="6">
        </div>
        <button type="submit" class="btn-submit">Guardar nueva contraseña</button>
    </form>
    {% endif %}

    <a href="/{{ slug }}/login" class="back-link">← Volver al inicio de sesión</a>
</div>
</body>
</html>
