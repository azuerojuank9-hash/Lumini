<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

<script>(function(){var t=localStorage.getItem('theme');if(t==='light')document.documentElement.setAttribute('data-theme','light');})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumini — Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#080B14;--bg2:#0F172A;--bg3:#1E293B;--bg4:#334155;--border:rgba(255,255,255,.06);--accent:#7C3AED;--accent2:#6D28D9;--accent-rgb:124,58,237;--text:#F8FAFC;--muted:#94A3B8;--sub:#64748B;--green:#22C55E;--red:#EF4444;--yellow:#EAB308;--rsm:8px;--rmd:12px;--rlg:16px;--tr:.2s cubic-bezier(.4,0,.2,1);--shadow:0 1px 4px rgba(0,0,0,.2);--shadow-lg:0 8px 32px rgba(0,0,0,.3);--glow:0 0 20px rgba(124,58,237,.15);}
[data-theme="light"]{--bg:#F8FAFC;--bg2:#FFFFFF;--bg3:#F1F5F9;--bg4:#E2E8F0;--border:rgba(0,0,0,.08);--text:#0F172A;--muted:#64748B;--sub:#94A3B8;--shadow:0 1px 4px rgba(0,0,0,.06);--shadow-lg:0 8px 32px rgba(0,0,0,.1);--glow:0 0 20px rgba(124,58,237,.08);}
        *{box-sizing:border-box;margin:0;padding:0;touch-action:manipulation;}
        body{font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);overflow:hidden;position:relative;}
        .bg-orb{position:fixed;border-radius:50%;filter:blur(100px);opacity:.12;animation:float 10s ease-in-out infinite;pointer-events:none;}
        .orb1{width:450px;height:450px;background:var(--accent);top:-100px;left:-120px;animation-delay:0s;}
        .orb2{width:300px;height:300px;background:var(--accent2);bottom:-80px;right:-80px;animation-delay:4s;}
        .orb3{width:200px;height:200px;background:var(--accent2);top:55%;left:60%;animation-delay:7s;}
        @keyframes float{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-28px) scale(1.04);}}
        body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,rgba(var(--accent-rgb),.08) 1px,transparent 1px);background-size:32px 32px;pointer-events:none;}
        .box{background:var(--bg2);border:1px solid var(--border);border-radius:22px;padding:44px 40px 40px;width:100%;max-width:400px;text-align:center;backdrop-filter:blur(20px);box-shadow:0 0 0 1px rgba(255,255,255,.04),0 24px 60px rgba(0,0,0,.5),0 0 80px rgba(var(--accent-rgb),.06);position:relative;z-index:1;animation:slideUp .5s cubic-bezier(.16,1,.3,1) both;}
        @keyframes slideUp{from{opacity:0;transform:translateY(28px);}to{opacity:1;transform:translateY(0);}}
        .shield{width:58px;height:58px;background:linear-gradient(135deg,rgba(var(--accent-rgb),.2),rgba(var(--accent-rgb),.1));border:1px solid rgba(var(--accent-rgb),.3);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:26px;}
        .logo{font-family:'Syne',sans-serif;font-size:1.9rem;font-weight:800;letter-spacing:7px;background:linear-gradient(135deg,#fff 30%,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px;}
        .logo-link{text-decoration:none;color:inherit;display:inline-block;transition:opacity var(--tr);}
        .logo-link:hover{opacity:.85;}
        .sub{color:var(--sub);font-size:11px;letter-spacing:3px;text-transform:uppercase;margin-bottom:34px;}
        .error{display:flex;align-items:center;gap:8px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:#EF4444;padding:11px 14px;border-radius:10px;font-size:13px;margin-bottom:20px;text-align:left;animation:shake .4s ease;}
        @keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-6px);}40%{transform:translateX(6px);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}
        .input-wrap{position:relative;margin-bottom:16px;}
        .input-wrap input{width:100%;padding:13px 44px 13px 16px;background:#0F172A;border:1.5px solid #1E293B;border-radius:var(--rmd);color:var(--text);font-family:'DM Sans',sans-serif;font-size:16px;letter-spacing:3px;transition:border-color var(--tr),box-shadow var(--tr);}
        .input-wrap input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.15);}
        .input-wrap input::placeholder{letter-spacing:2px;color:var(--sub);}
        .eye-btn{position:absolute;right:13px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--sub);font-size:16px;cursor:pointer;padding:4px;transition:color var(--tr);}
        .eye-btn:hover{color:var(--accent);}
        .btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:var(--rmd);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;letter-spacing:.5px;min-height:48px;transition:all var(--tr);box-shadow:0 4px 20px rgba(var(--accent-rgb),.3);position:relative;overflow:hidden;}
        .btn:hover{transform:translateY(-1px);box-shadow:0 6px 28px rgba(var(--accent-rgb),.4);}
        .btn:active{transform:translateY(0);}
        .btn::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent);transform:translateX(-100%);transition:transform .5s;}
        .btn:hover::after{transform:translateX(100%);}
        .footer{margin-top:24px;font-size:11px;color:var(--sub);}
        .footer span{color:var(--muted);}
        @media(max-width:480px){.box{padding:32px 20px;}.logo{font-size:1.6rem;}.shield{width:48px;height:48px;font-size:22px;}}
        @media(max-width:375px){.box{padding:24px 16px;}.sub{font-size:10px;letter-spacing:2px;margin-bottom:24px;}.input-wrap input{padding:11px 40px 11px 12px;font-size:15px;}.btn{padding:12px;font-size:13px;min-height:44px;}}
    </style>

  <link rel="stylesheet" href="/static/css/lumini.css">
<link rel="stylesheet" href="/static/css/enhanced.css">

<body>

<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>
<div class="bg-orb orb3"></div>

<div class="box">
    <a href="/admin" class="logo-link">
    <div class="shield">🛡️</div>
    <div class="logo">LUMINI</div>
    </a>
    <div class="sub">Acceso administrativo</div>

    {% if error %}
    <div class="error"><i data-lucide="alert-triangle"></i> {{ error }}</div>
    {% endif %}

    <form method="POST" autocomplete="off">
        <input type="hidden" name="accion" value="admin_login">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="input-wrap">
            <input type="password" name="password" id="pwdInput"
                   placeholder="••••••••" autofocus autocomplete="current-password">
            <button type="button" class="eye-btn" onclick="togglePwd()" id="eyeBtn" aria-label="Mostrar/ocultar contraseña"><i data-lucide="eye"></i></button>
        </div>
        <button type="submit" class="btn">Ingresar <i data-lucide="arrow-right"></i></button>
    </form>

    <div class="footer">
        Lumini &nbsp;·&nbsp; <span>Panel de administración</span>
    </div>
</div>

<script>
function togglePwd(){
    var inp = document.getElementById('pwdInput');
    var btn = document.getElementById('eyeBtn');
    if(inp.type === 'password'){
        inp.type = 'text';
        btn.textContent = '🙈';
    } else {
        inp.type = 'password';
        btn.innerHTML = '<i data-lucide="eye"></i>';
    }
}
</script>
<button onclick="toggleTheme()" style="position:fixed;bottom:20px;left:20px;z-index:9999;width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.3);" aria-label="Cambiar tema">🌙</button>
<script>function toggleTheme(){var h=document.documentElement;if(h.getAttribute('data-theme')==='light'){h.removeAttribute('data-theme');localStorage.setItem('theme','dark');}else{h.setAttribute('data-theme','light');localStorage.setItem('theme','light');}}</script>
  <script src="/static/js/lumini.js"></script>

</html>
