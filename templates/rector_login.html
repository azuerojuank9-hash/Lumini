<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script>(function(){var t=localStorage.getItem('theme');if(t==='light')document.documentElement.setAttribute('data-theme','light');})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rector — {{ colegio.nombre if colegio else slug }}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080B14;--bg2:#0F172A;--bg3:#1E293B;--bg4:#334155;--border:rgba(255,255,255,.06);--accent:#6D28D9;--accent2:#4C1D95;--accent-rgb:109,40,217;--text:#F8FAFC;--muted:#94A3B8;--sub:#64748B;--green:#22C55E;--red:#EF4444;--rsm:8px;--rmd:12px;--rlg:16px;--tr:.2s cubic-bezier(.4,0,.2,1);--shadow:0 1px 4px rgba(0,0,0,.2);--shadow-lg:0 8px 32px rgba(0,0,0,.3);}
[data-theme="light"]{--bg:#F8FAFC;--bg2:#FFFFFF;--bg3:#F1F5F9;--bg4:#E2E8F0;--border:rgba(0,0,0,.08);--text:#0F172A;--muted:#64748B;--sub:#94A3B8;--shadow:0 1px 4px rgba(0,0,0,.06);--shadow-lg:0 8px 32px rgba(0,0,0,.1);}
*{box-sizing:border-box;margin:0;padding:0;touch-action:manipulation;}
body{font-family:'Inter',sans-serif;background:var(--bg);min-height:100vh;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;position:relative;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,rgba(var(--accent-rgb),.06) 1px,transparent 1px);background-size:32px 32px;pointer-events:none;}
.bg-orb{position:fixed;border-radius:50%;filter:blur(120px);opacity:.12;animation:float 10s ease-in-out infinite;pointer-events:none;}
.orb1{width:500px;height:500px;background:var(--accent);top:-200px;left:-200px;animation-delay:0s;}
.orb2{width:400px;height:400px;background:var(--accent2);bottom:-150px;right:-150px;animation-delay:4s;}
@keyframes float{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-30px) scale(1.04);}}
.logo-wrap{margin-bottom:8px;text-align:center;}
.logo-wrap img{height:88px;width:88px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px rgba(var(--accent-rgb),.4),0 8px 40px rgba(0,0,0,.4);transition:transform var(--tr);}
.logo-wrap img:hover{transform:scale(1.05);}
.brand{font-family:'Inter',sans-serif;font-size:1.5rem;font-weight:800;letter-spacing:3px;background:linear-gradient(135deg,#fff 40%,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-align:center;}
.subtitle{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:4px;margin-bottom:20px;text-align:center;}
.badge-role{display:inline-flex;align-items:center;gap:6px;background:rgba(var(--accent-rgb),.1);border:1px solid rgba(var(--accent-rgb),.2);border-radius:99px;padding:5px 16px;font-size:12px;color:var(--accent);margin-bottom:18px;font-weight:500;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rlg);padding:28px;width:100%;max-width:420px;box-shadow:0 1px 4px rgba(0,0,0,.3);animation:slideUp .4s cubic-bezier(.16,1,.3,1) both;}
@keyframes slideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.field{margin-bottom:14px;}
.field label{display:block;font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;font-weight:600;}
.field input{width:100%;padding:11px 14px;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--rsm);color:var(--text);font-family:'Inter',sans-serif;font-size:16px;transition:border-color var(--tr),box-shadow var(--tr);}
.field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.12);}
.field input::placeholder{color:var(--sub);}
.pass-wrapper{position:relative;}
.pass-wrapper input{padding-right:2.5rem;width:100%;}
.toggle-pass{position:absolute;right:.75rem;top:50%;transform:translateY(-50%);cursor:pointer;background:none;border:none;color:var(--sub);font-size:1.1rem;transition:color var(--tr);}
.toggle-pass:hover{color:var(--accent);}
.btn-submit{width:100%;padding:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:var(--rsm);font-family:'Inter',sans-serif;font-size:15px;font-weight:600;cursor:pointer;margin-top:4px;min-height:48px;transition:all var(--tr);box-shadow:0 4px 16px rgba(var(--accent-rgb),.2);}
.btn-submit:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(var(--accent-rgb),.3);}
.btn-submit:active{transform:scale(.98);}
.alert{padding:10px 14px;border-radius:var(--rsm);font-size:13px;margin-bottom:16px;}
.alert-error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:var(--red);}
.alert-success{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.2);color:var(--green);}
.back-link{display:block;text-align:center;margin-top:16px;font-size:12px;color:var(--muted);text-decoration:none;transition:color var(--tr);}
.back-link:hover{color:var(--accent);}
@media(max-width:480px){.card{padding:20px 16px;}.logo-wrap img{height:72px;width:72px;}.brand{font-size:1.2rem;letter-spacing:2px;}}
</style>
</head>
<body>
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>
<a href="/{{ slug }}/login" style="text-decoration:none;color:inherit;display:block;">
<div class="logo-wrap">
    {% if colegio and colegio.logo %}
    <img src="/static/logos/{{ colegio.logo }}" alt="Logo {{ colegio.nombre }}">
    {% else %}
    <img src="/static/lumini_logo.png" alt="Lumini">
    {% endif %}
</div>
<div class="brand">LUMINI</div>
</a>
<p class="subtitle">{{ colegio.nombre if colegio else slug }}</p>
<div class="badge-role"><i class="fas fa-graduation-cap"></i> Rector</div>
<div class="card">
    {% if error %}
    <div class="alert {% if exito %}alert-success{% else %}alert-error{% endif %}">{{ error }}{{ exito }}</div>
    {% endif %}
    <form method="POST">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="field">
            <label>Usuario</label>
            <input type="text" name="rec_usuario" placeholder="ej: rector_colegio" required autocomplete="username">
        </div>
        <div class="field">
            <label>Contraseña</label>
            <div class="pass-wrapper">
                <input type="password" name="rec_password" placeholder="Ingresa tu contraseña" required autocomplete="current-password">
                <button type="button" class="toggle-pass" onclick="togglePass(this)" aria-label="Mostrar/ocultar contraseña"><i class="fas fa-eye"></i></button>
            </div>
        </div>
        <button type="submit" class="btn-submit">Entrar al panel</button>
    </form>
</div>
<a href="/{{ slug }}/login" class="back-link"><i class="fas fa-arrow-left"></i> Volver al inicio de sesión</a>
<script>
function togglePass(btn) {
    var input = btn.previousElementSibling;
    if (input.type === 'password') { input.type = 'text'; btn.textContent = '🙈'; }
    else { input.type = 'password'; btn.textContent = '<i class="fas fa-eye"></i>'; }
}
</script>
<script>function toggleTheme(){var h=document.documentElement;if(h.getAttribute('data-theme')==='light'){h.removeAttribute('data-theme');localStorage.setItem('theme','dark');}else{h.setAttribute('data-theme','light');localStorage.setItem('theme','light');}}</script>
</body>
</html>
