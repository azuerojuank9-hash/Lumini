<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LUMINI — Sin conexión</title>
<style>
:root{--muted:#8896B0;--accent:#7C3AED;--accent-rgb:124,58,237;--text-on-accent:#fff;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,sans-serif;background:#070B15;color:#F1F5F9;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.wrap{display:flex;flex-direction:column;align-items:center;text-align:center;max-width:400px;}
.logo{width:80px;height:80px;border-radius:18px;margin-bottom:24px;box-shadow:0 4px 24px rgba(var(--accent-rgb),.25);}
h1{font-size:22px;font-weight:700;margin-bottom:8px;}
p{font-size:14px;color:var(--muted);margin-bottom:28px;line-height:1.6;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;background:var(--accent);color:var(--text-on-accent);border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;transition:all .15s ease;}
.btn:hover{filter:brightness(1.15);transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
</style>
</head>
<body>
<div class="wrap">
  <img src="/static/lumini_logo.webp" alt="LUMINI" class="logo">
  <h1>Sin conexión</h1>
  <p>No hay conexión a Internet. Verifica tu conexión e intenta de nuevo.</p>
  <button class="btn" onclick="window.location.reload()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    Reintentar
  </button>
</div>
</body>
</html>
